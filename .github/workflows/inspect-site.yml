name: 게시판 구조 확인(임시)
on:
  push:
    paths: [".github/workflows/inspect-site.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          for u in https://freebene.com/diablo/write https://freebene.com/bbs/login.php https://freebene.com/diablo; do
            echo "=================== $u"
            curl -sSL -A "$UA" -D - "$u" | grep -iE "^HTTP|^location|<form|<input|<textarea|<button|alert\(|login|g-recaptcha|wr_|mb_id|mb_password|btn_submit|<title|editor|captcha|action=" | grep -v "type=\"hidden\" name=\"[a-z_]*\" value=\"\"" | head -120
          done
